version: 2
updates:
  # ---------- 前端依赖 ----------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 次要/补丁版本合并成一个 PR，避免每天被几十个 PR 淹没
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # ---------- Rust 依赖（Cargo.toml / Cargo.lock 在 src-tauri 下）----------
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # ---------- GitHub Actions 自身 ----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
