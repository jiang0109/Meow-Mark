<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="保存真实 Markdown 文件的本地笔记应用" />
    <title>Markdown Hub</title>
    <script>
      // 首屏渲染前就套用主题，避免暗色用户看到一闪而过的白屏。
      // 与 src/theme.ts 使用同一个 localStorage 键，取值：system | light | dark
      (function () {
        try {
          var choice = localStorage.getItem('markdown-hub-theme') || 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* localStorage 不可用时忽略，按亮色渲染 */
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
